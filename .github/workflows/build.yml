name: Build macOS packages

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/build-release.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: wps-latex-mathtype-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
